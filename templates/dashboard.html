<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anypoint MQ · Environment Stats</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>
  :root{
    --bg:#f6f7f4; --panel:#ffffff; --ink:#1d2733; --muted:#66717d;
    --line:#e3e6e0; --accent:#0f62fe;
    --c-sent:#4c78a8; --c-received:#72808f; --c-success:#2e8b57;
    --c-failure:#c94f3d; --c-reproc:#d99a1b; --c-visible:#7b5ea7;
    font-size:15px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font-family:"Segoe UI",system-ui,-apple-system,sans-serif}
  .mono{font-family:"SFMono-Regular",Consolas,"Courier New",monospace}
  header{display:flex;flex-wrap:wrap;align-items:baseline;gap:14px;
         padding:22px 28px 10px}
  header h1{margin:0;font-size:1.35rem;letter-spacing:.01em}
  header .meta{color:var(--muted);font-size:.85rem}
  header .meta b{color:var(--ink)}
  header a.back{margin-left:auto;font-size:.82rem;color:var(--accent);
                text-decoration:none;font-weight:600}
  main{padding:0 28px 40px;max-width:1400px;margin:0 auto}
  .panel{background:var(--panel);border:1px solid var(--line);
         border-radius:10px;padding:18px 20px;margin-top:16px}
  .panel h2{margin:0 0 6px;font-size:.95rem;text-transform:uppercase;
            letter-spacing:.08em;color:var(--muted)}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
        gap:12px;margin-top:16px}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;
       padding:14px 16px}
  .kpi .v{font-size:1.5rem;font-weight:600}
  .kpi .l{font-size:.78rem;color:var(--muted);text-transform:uppercase;
          letter-spacing:.06em;margin-top:2px}
  .kpi .bar{height:4px;border-radius:2px;margin-top:8px}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 6px}
  .chip{border:1px solid var(--line);border-radius:999px;padding:5px 13px;
        font-size:.82rem;cursor:pointer;background:#fff;display:flex;
        align-items:center;gap:7px;user-select:none}
  .chip .dot{width:9px;height:9px;border-radius:50%}
  .chip.off{opacity:.35}
  .chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  select{border:1px solid var(--line);border-radius:8px;padding:6px 10px;
         font-size:.85rem;background:#fff;color:var(--ink)}
  .row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;
       justify-content:space-between}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));
        gap:14px;margin-top:12px}
  .small{background:var(--panel);border:1px solid var(--line);
         border-radius:10px;padding:12px 14px}
  .small h3{margin:0 0 2px;font-size:.9rem;display:flex;gap:8px;align-items:center}
  .small .sub{font-size:.75rem;color:var(--muted)}
  .badge{font-size:.65rem;padding:2px 7px;border-radius:999px;
         border:1px solid var(--line);color:var(--muted);text-transform:uppercase}
  .badge.dlq{border-color:var(--c-failure);color:var(--c-failure)}
  .tooltip{position:fixed;pointer-events:none;background:#1d2733;color:#fff;
           padding:8px 11px;border-radius:8px;font-size:.78rem;line-height:1.45;
           opacity:0;transition:opacity .1s;z-index:10;max-width:260px}
  .axis text{fill:var(--muted);font-size:11px}
  .axis line,.axis path{stroke:var(--line)}
  .loading{padding:60px;text-align:center;color:var(--muted)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <h1>Anypoint MQ · Environment Stats</h1>
  <div class="meta" id="meta">loading &hellip;</div>
  <a class="back" href="/">&larr; New fetch</a>
</header>

<main>
  <div id="loading" class="loading">Loading stats&hellip;</div>

  <div id="app" hidden>
    <div class="kpis" id="kpis"></div>

    <div class="panel">
      <div class="row">
        <h2>Environment totals per bucket</h2>
        <div class="chips" id="chips"></div>
      </div>
      <svg id="overview" width="100%" height="320"></svg>
    </div>

    <div class="panel">
      <div class="row">
        <h2>Focus queue</h2>
        <select id="qsel"></select>
      </div>
      <svg id="focus" width="100%" height="300"></svg>
    </div>

    <div class="panel">
      <div class="row">
        <h2>All destinations</h2>
        <select id="sortsel">
          <option value="volume">Sort by volume</option>
          <option value="failure">Sort by failures</option>
          <option value="name">Sort by name</option>
        </select>
      </div>
      <div class="grid" id="grid"></div>
    </div>
  </div>
</main>

<div class="tooltip" id="tip"></div>

<script>
const METRICS = [
  {key:"sent",         label:"Sent",         color:"var(--c-sent)",     hex:"#4c78a8"},
  {key:"received",     label:"Received",     color:"var(--c-received)", hex:"#72808f"},
  {key:"success",      label:"Success (acked)", color:"var(--c-success)", hex:"#2e8b57"},
  {key:"failure",      label:"Failure (nack / unacked)", color:"var(--c-failure)", hex:"#c94f3d"},
  {key:"reprocessing", label:"Reprocessing (inflight)", color:"var(--c-reproc)", hex:"#d99a1b"},
  {key:"visible",      label:"Visible backlog", color:"var(--c-visible)", hex:"#7b5ea7"},
];
const active = new Set(["sent","success","failure","reprocessing"]);
const fmt = d3.format(","), tip = d3.select("#tip");
let DATA = null;

fetch("/api/stats")
  .then(r => { if(!r.ok) throw new Error("no data"); return r.json(); })
  .then(boot)
  .catch(() => {
    document.getElementById("loading").innerHTML =
      'No stats loaded yet. <a href="/">Go back and fetch or load sample data</a>.';
  });

function boot(data){
  DATA = data;
  document.getElementById("loading").hidden = true;
  document.getElementById("app").hidden = false;
  const t0 = new Date(data.startDate), t1 = new Date(data.endDate);
  document.getElementById("meta").innerHTML =
    `env <b>${data.env||"?"}</b> &middot; region <b>${data.region||"?"}</b> &middot; ` +
    `granularity <b>${data.period}</b> &middot; ` +
    `<span class="mono">${t0.toISOString().slice(0,16)}Z &rarr; ${t1.toISOString().slice(0,16)}Z</span>`;
  drawKpis(); drawChips(); drawOverview(); buildFocus(); drawGrid();
  window.addEventListener("resize", () => { drawOverview(); drawFocus(); drawGrid(); });
}

function drawKpis(){
  const sum = k => d3.sum(DATA.totals, d => d[k] || 0);
  const items = [
    {l:"Queues tracked", v: DATA.queues.length, c:"var(--accent)"},
    {l:"Messages sent", v: sum("sent"), c:"var(--c-sent)"},
    {l:"Received", v: sum("received"), c:"var(--c-received)"},
    {l:"Success", v: sum("success"), c:"var(--c-success)"},
    {l:"Failures", v: sum("failure"), c:"var(--c-failure)"},
    {l:"Peak backlog", v: d3.max(DATA.totals, d => d.visible) || 0, c:"var(--c-visible)"},
  ];
  d3.select("#kpis").selectAll("div").data(items).join("div")
    .attr("class","kpi")
    .html(d => `<div class="v mono">${fmt(d.v)}</div>
                <div class="l">${d.l}</div>
                <div class="bar" style="background:${d.c}"></div>`);
}

function drawChips(){
  d3.select("#chips").selectAll("button").data(METRICS).join("button")
    .attr("class", d => "chip" + (active.has(d.key) ? "" : " off"))
    .html(d => `<span class="dot" style="background:${d.color}"></span>${d.label}`)
    .on("click", (e,d) => {
      active.has(d.key) ? active.delete(d.key) : active.add(d.key);
      drawChips(); drawOverview(); drawFocus(); drawGrid();
    });
}

function lineChart(svgSel, series, {height, compact=false}){
  const svg = d3.select(svgSel);
  svg.selectAll("*").remove();
  const W = svg.node().clientWidth || 600, H = height;
  svg.attr("viewBox", `0 0 ${W} ${H}`);
  const m = compact ? {t:8,r:8,b:20,l:40} : {t:12,r:16,b:26,l:52};
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  if (!series.length) return;

  const x = d3.scaleTime()
    .domain(d3.extent(series, d => d.ts)).range([0, iw]);
  const shown = METRICS.filter(mt => active.has(mt.key));
  const ymax = d3.max(series, d => d3.max(shown, mt => d[mt.key] || 0)) || 1;
  const y = d3.scaleLinear().domain([0, ymax]).nice().range([ih, 0]);

  const g = svg.append("g").attr("transform", `translate(${m.l},${m.t})`);
  g.append("g").attr("class","axis").attr("transform",`translate(0,${ih})`)
    .call(d3.axisBottom(x).ticks(compact ? 4 : 7).tickSizeOuter(0));
  g.append("g").attr("class","axis")
    .call(d3.axisLeft(y).ticks(compact ? 3 : 5).tickFormat(d3.format("~s")));
  g.append("g").attr("class","axis").selectAll("line")
    .data(y.ticks(compact ? 3 : 5)).join("line")
    .attr("x1",0).attr("x2",iw).attr("y1",y).attr("y2",y)
    .attr("stroke","var(--line)").attr("stroke-dasharray","2,3");

  for (const mt of shown){
    const line = d3.line()
      .x(d => x(d.ts)).y(d => y(d[mt.key] || 0)).curve(d3.curveMonotoneX);
    g.append("path").datum(series)
      .attr("fill","none").attr("stroke", mt.hex)
      .attr("stroke-width", compact ? 1.4 : 2).attr("d", line);
    if (mt.key === "failure"){
      const area = d3.area()
        .x(d => x(d.ts)).y0(ih).y1(d => y(d[mt.key] || 0)).curve(d3.curveMonotoneX);
      g.append("path").datum(series)
        .attr("fill", mt.hex).attr("opacity", .08).attr("d", area);
    }
  }

  const bisect = d3.bisector(d => d.ts).center;
  const cursor = g.append("line")
    .attr("y1",0).attr("y2",ih).attr("stroke","var(--muted)")
    .attr("stroke-dasharray","3,3").attr("opacity",0);
  svg.on("pointermove", ev => {
    const [px] = d3.pointer(ev, g.node());
    const i = bisect(series, x.invert(px));
    const d = series[i]; if (!d) return;
    cursor.attr("x1", x(d.ts)).attr("x2", x(d.ts)).attr("opacity", 1);
    const rows = shown.map(mt =>
      `<div><span style="color:${mt.hex}">&#9679;</span> ${mt.label}: <b>${fmt(d[mt.key]||0)}</b></div>`).join("");
    tip.style("opacity",1)
       .style("left", Math.min(ev.clientX+14, innerWidth-280)+"px")
       .style("top", (ev.clientY+14)+"px")
       .html(`<div class="mono">${new Date(d.ts).toISOString().slice(0,16)}Z</div>${rows}`);
  }).on("pointerleave", () => { tip.style("opacity",0); cursor.attr("opacity",0); });
}

function drawOverview(){ lineChart("#overview", DATA.totals, {height:320}); }

function buildFocus(){
  const sel = d3.select("#qsel");
  sel.selectAll("option").data(DATA.queues).join("option")
    .attr("value", d => d.name).text(d => d.name);
  sel.on("change", drawFocus);
  drawFocus();
}
function drawFocus(){
  const name = document.getElementById("qsel").value;
  const q = DATA.queues.find(q => q.name === name) || DATA.queues[0];
  if (q) lineChart("#focus", q.series, {height:300});
}

function drawGrid(){
  const mode = document.getElementById("sortsel").value;
  const vol = q => d3.sum(q.series, d => d.received + d.sent);
  const fail = q => d3.sum(q.series, d => d.failure);
  const qs = [...DATA.queues].sort((a,b) =>
    mode === "name" ? d3.ascending(a.name, b.name) :
    mode === "failure" ? fail(b) - fail(a) : vol(b) - vol(a));

  const cards = d3.select("#grid").selectAll("div.small")
    .data(qs, d => d.name).join("div").attr("class","small");
  cards.html(d => `
    <h3><span>${d.name}</span>
        <span class="badge${d.dlq ? " dlq":""}">${d.dlq ? "DLQ" : d.type}</span></h3>
    <div class="sub mono">recv ${fmt(d3.sum(d.series,p=>p.received))} &middot;
         ok ${fmt(d3.sum(d.series,p=>p.success))} &middot;
         fail ${fmt(d3.sum(d.series,p=>p.failure))}</div>
    <svg width="100%" height="130"></svg>`);
  cards.each(function(d){ lineChart(d3.select(this).select("svg").node(), d.series, {height:130, compact:true}); });
  document.getElementById("sortsel").onchange = drawGrid;
}
</script>
</body>
</html>
